[package]
name = "fast-walk"
# A release takes its version from its tag (.github/set-version-from-tag.sh);
# this one is only what an untagged build reports.
version = "0.3.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/reflex-dev/fast-walk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fast_walk"
crate-type = ["cdylib"]

[profile.release]
debug = "line-tables-only" # symbols for perf profiling; near-zero perf cost
opt-level = 3
lto = true        # Link-time optimization.
codegen-units = 1 # Slower compilation but faster code.

[dependencies]
pyo3 = "0.29.3"
